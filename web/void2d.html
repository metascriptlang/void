<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Void — void2d (sokol)</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #canvas { width: 100%; height: 100%; display: block; }
  #status { position: fixed; top: 8px; left: 8px; font: 13px monospace; color: #8f8; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">loading…</div>
<script>
  // WebGPU-first, WebGL2 fallback. Each backend is a self-contained emscripten
  // build in its own dir (the .js hardcodes its .wasm/.data names).
  const status = document.getElementById('status');
  // ?gl / ?wgpu force a backend; otherwise WebGPU-first with WebGL2 fallback. ?entry=<name> loads
  // another entry built beside this page (default main2d). ?js loads the --target=js build of the
  // same demo (js-wgpu/, js-gl/) instead of the wasm one: the page fetches the files the demo reads
  // from disk into window.voidAssets first, because a browser has no files.
  const p = new URLSearchParams(location.search);
  const force = p.has('gl') ? 'gl' : p.has('wgpu') ? 'wgpu' : null;
  const useWgpu = force ? force === 'wgpu' : !!navigator.gpu;
  const js = p.has('js');
  const dir = (js ? 'js-' : '') + (useWgpu ? 'wgpu' : 'gl');
  status.textContent = 'void2d — ' + (useWgpu ? 'WebGPU' : 'WebGL2') + (js ? ', JS' : '') + (force ? ' (forced)' : (navigator.gpu ? '' : ' — no WebGPU'));
  window.Module = {
    canvas: document.getElementById('canvas'),
    locateFile: (path) => dir + '/' + path,
  };
  const load = () => {
    const s = document.createElement('script');
    s.src = dir + '/' + (p.get('entry') || (js ? 'main2dWeb' : 'main2d')) + '.js';
    s.onerror = () => { status.textContent = 'failed to load ' + s.src; };
    document.body.appendChild(s);
  };
  if (js) {
    const assets = ['assets/test.png', 'assets/font.ttf'];
    Promise.all(assets.map((a) => fetch(dir + '/' + a).then((r) => {
      if (!r.ok) throw new Error(a + ': ' + r.status);
      return r.arrayBuffer();
    }))).then((buffers) => {
      window.voidAssets = Object.fromEntries(assets.map((a, i) => [a, new Uint8Array(buffers[i])]));
      load();
    }, (e) => { status.textContent = 'failed to fetch ' + e.message; });
  } else {
    load();
  }
</script>
</body>
</html>
