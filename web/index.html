<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Void Engine — sokol</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #canvas { width: 100%; height: 100%; display: block; }
  #status { position: fixed; top: 8px; left: 8px; font: 13px monospace; color: #8f8; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">loading…</div>
<script>
  // WebGPU-first, WebGL2 fallback. Each backend is a self-contained emscripten
  // build in its own dir (the .js hardcodes its .wasm/.data names).
  const status = document.getElementById('status');
  // ?gl / ?wgpu force a backend; otherwise WebGPU-first with WebGL2 fallback.
  const p = new URLSearchParams(location.search);
  const force = p.has('gl') ? 'gl' : p.has('wgpu') ? 'wgpu' : null;
  const useWgpu = force ? force === 'wgpu' : !!navigator.gpu;
  const dir = useWgpu ? 'wgpu' : 'gl';
  status.textContent = (useWgpu ? 'WebGPU' : 'WebGL2') + (force ? ' (forced)' : (navigator.gpu ? '' : ' — no WebGPU'));
  // Builds live in gl/ and wgpu/ subdirs; emscripten resolves .wasm/.data via
  // locateFile (defaults to document-relative → 404). Prepend the backend dir.
  window.Module = {
    canvas: document.getElementById('canvas'),
    locateFile: (path) => dir + '/' + path,
  };
  const s = document.createElement('script');
  s.src = dir + '/mainSokol.js';
  s.onerror = () => { status.textContent = 'failed to load ' + s.src; };
  document.body.appendChild(s);
</script>
</body>
</html>
