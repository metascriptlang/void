<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>void3d readback runner — WebGL2</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #canvas { display: block; width: 320px; height: 240px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const query = new URLSearchParams(location.search);
  const factor = query.get('VOID_OUTLINE_FRAMEBUFFER_FACTOR');
  const canvas = document.getElementById('canvas');
  const framebufferFactor = factor === '2' ? 2 : 1;
  const sizes = { copyAlpha: [160, 120], cardTable: [640, 480] };
  const [width, height] = sizes[query.get('entry')] ?? [320 * framebufferFactor, 240 * framebufferFactor];
  canvas.width = width;
  canvas.height = height;
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
  window.voidDone = null;
  window.Module = {
    canvas: document.getElementById('canvas'),
    preRun: [() => {
      for (const [key, value] of query) {
        if (key.startsWith('VOID_')) ENV[key] = value;
      }
    }],
  };
  const s = document.createElement('script');
  s.src = query.get('entry') + '.js';
  document.body.appendChild(s);
</script>
</body>
</html>
