<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>void2d golden runner — WebGL2</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const query = new URLSearchParams(location.search);
  const canvas = document.getElementById('canvas');
  canvas.style.width = query.get('w') + 'px';
  canvas.style.height = query.get('h') + 'px';
  window.voidDone = null;
  window.Module = {
    canvas: canvas,
    preRun: [() => {
      ENV.VOID_SCENE = query.get('scene');
      FS.mkdirTree(query.get('dir'));
    }],
  };
</script>
<script src="runner.js"></script>
</body>
</html>
